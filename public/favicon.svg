<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- QRMENU brand mark: stylized QR code on brand orange.
       Three finder-patterns (the squares-in-squares of real QR codes) +
       a fourth dot for visual balance. Readable at 16x16 favicon size. -->
  <rect width="64" height="64" rx="14" fill="#ea580c"/>
  <rect x="12" y="12" width="16" height="16" rx="2" fill="#fff"/>
  <rect x="16" y="16" width="8" height="8" rx="1" fill="#ea580c"/>
  <rect x="36" y="12" width="16" height="16" rx="2" fill="#fff"/>
  <rect x="40" y="16" width="8" height="8" rx="1" fill="#ea580c"/>
  <rect x="12" y="36" width="16" height="16" rx="2" fill="#fff"/>
  <rect x="16" y="40" width="8" height="8" rx="1" fill="#ea580c"/>
  <rect x="40" y="40" width="12" height="12" rx="3" fill="#fff"/>
</svg>
