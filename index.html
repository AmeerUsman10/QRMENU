<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="description" content="QRMENU — QR-based table ordering for restaurants. Customers scan a code at their table, browse the menu, order, pay, and track preparation in real time. Kitchen staff manage live orders." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="apple-mobile-web-app-title" content="QRMENU" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp link previews) -->

    <meta property="og:title" content="QRMENU — QR-based table ordering" />
    <meta property="og:description" content="Scan a QR at your table, order, and track your meal in real time. No app install required." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QRMENU — QR-based table ordering" />
    <meta name="twitter:description" content="Scan a QR at your table, order, and track your meal in real time. No app install required." />
    <meta name="twitter:image" content="/favicon.svg" />

    <title>QRMENU</title>
